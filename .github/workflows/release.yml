name: Release VBLIS

on:
  # Manual trigger via the GitHub web UI. With publish_release unchecked it's a build-only run:
  # the checks, the backend smoke test and the size check still run, and no release is created.
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag, e.g. v0.7.0'
        required: true
        type: string
      publish_release:
        description: 'Create a draft GitHub release (uncheck to only build artifacts)'
        required: true
        type: boolean
        default: true
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

  # Automatic trigger on Git tag push
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Rejects a bad tag or an existing release within a minute, before the long build starts
  prepare:
    runs-on: ubuntu-latest
    permissions:
      # write, not read: draft releases are only listed to tokens with push access
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Validate Version Tag
        id: version
        env:
          # Passed via env, not expression syntax inside the script, so an input can't inject code
          VERSION_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version_tag || github.ref_name }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish_release }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version tag '$VERSION_TAG' must look like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          echo "Version $VERSION_TAG, publish: $PUBLISH"
          echo "version=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Refuse to Overwrite an Existing Release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh needs to be told the repository
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # A failing gh call (auth, network) stops the step instead of reading as "no release"
          # Lists drafts too: action-gh-release would reuse a draft and replace its assets
          releases="$(gh release list --limit 1000 --json tagName --jq '.[].tagName')"
          if grep -Fxq "$TAG" <<<"$releases"; then
            echo "::error::A release for $TAG already exists (published or draft). This workflow never overwrites one; delete a stale draft by hand to rebuild."
            exit 1
          fi
          # A tag push builds the tagged commit; a manual run builds its branch head, so with an
          # existing tag the assets could come from another commit than the tag points at
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            refs="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG" --jq '.[].ref')"
            if grep -Fxq "refs/tags/$TAG" <<<"$refs"; then
              echo "::error::Tag $TAG already exists. Release it from its tag-push run (re-run that run), not from a manual run."
              exit 1
            fi
          fi
          echo "No release and no conflicting tag for $TAG"

  # Lint, unit tests and the vite build: the CI workflow itself, on this same commit
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-release:
    needs: [prepare, checks]
    # 22.04 keeps the build close to the oldest Linux the desktop bundle is tested on
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # creates the draft release
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # The version the backend is developed and tested on
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            api/requirements.txt
            api/constraints.txt

      # Latest 22.x: Vite 5 needs >= 20.19
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          check-latest: true
          cache: "npm"
          cache-dependency-path: vsite/package-lock.json

      # build_linux.sh builds the QuickJS shell as a static musl binary
      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools cmake build-essential

      # Every package is pinned by api/constraints.txt. The torch==2.14.1+cu130 pin takes the CUDA
      # wheel from the cu130 index that requirements.txt adds.
      - name: Install Python Dependencies
        run: |
          python -m venv api/.venv
          api/.venv/bin/python -m pip install --upgrade pip
          api/.venv/bin/pip install -r api/requirements.txt -c api/constraints.txt

      # pip has no strict mode for constraints: a dependency missing from constraints.txt would
      # install unpinned without a word
      - name: Check That Every Installed Python Package Is Pinned
        run: |
          api/.venv/bin/pip check
          api/.venv/bin/python - <<'PY'
          import pathlib, re, subprocess
          normalize = lambda line: re.sub(r"[-_.]+", "-", line.split("==")[0]).lower() + "==" + line.split("==", 1)[1]
          pinned = {
              normalize(line.strip())
              for line in pathlib.Path("api/constraints.txt").read_text().splitlines()
              if "==" in line and not line.lstrip().startswith("#")
          }
          installed = subprocess.check_output(["api/.venv/bin/pip", "freeze"], text=True)
          unpinned = []
          for line in installed.splitlines():
              if "==" not in line:
                  continue
              if normalize(line) not in pinned:
                  unpinned.append(line)
          if unpinned:
              raise SystemExit("Installed without a pin in api/constraints.txt: " + ", ".join(unpinned))
          print("Every installed package is pinned")
          PY

      # Starts api/main.py the way the shell does and checks /models and /fs/list (runs locally too)
      - name: Smoke-Test the Backend
        timeout-minutes: 10
        run: ./.github/scripts/smoke-test-backend.sh api/.venv/bin/python

      # Frontend + QuickJS shell + packaged api/ in dist/vblis-linux-x86_64. The shell smoke test
      # inside the script only exercises the static page; the backend was tested above.
      - name: Build Linux Desktop Bundle
        run: ./build_linux.sh --no-smoke

      - name: Smoke-Test the Packaged Shell
        timeout-minutes: 5
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp -a dist/vblis-linux-x86_64/. "$work/"
          # exec so $! is the shell binary itself, not a subshell around it
          ( cd "$work" && exec env VBLIS_NO_BACKEND=1 VBLIS_NO_BROWSER=1 VBLIS_SHELL_PORT=8124 ./vblis >shell.log 2>&1 ) &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; rm -rf "$work"' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8124/; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8124/ | grep -q '__VBLIS_SHELL__'
          curl -fsS -o /dev/null http://127.0.0.1:8124/index.js
          echo "Packaged shell serves the page and bundle"

      - name: Package Release Assets
        run: |
          set -euo pipefail
          mkdir -p dist-built
          tar -C dist -czf "dist-built/VBLIS-linux-x86_64-$VERSION.tar.gz" vblis-linux-x86_64
          python - "vsite/dist" "dist-built/VBLIS-web-$VERSION.zip" <<'PY'
          import pathlib, sys, zipfile
          source, target = pathlib.Path(sys.argv[1]), sys.argv[2]
          with zipfile.ZipFile(target, "w", zipfile.ZIP_DEFLATED) as archive:
              for item in sorted(source.rglob("*")):
                  if item.is_file():
                      archive.write(item, item.relative_to(source).as_posix())
              names = archive.namelist()
          if "index.html" not in names:
              sys.exit("index.html is not at the zip's root")
          print(f"{target}: {len(names)} files")
          PY

      # GitHub release assets must be under 2 GiB each; the source-based Linux bundle is far smaller
      - name: Check Asset Sizes & Write SHA256SUMS.txt
        working-directory: dist-built
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=( *.tar.gz *.zip )
          if [ "${#assets[@]}" -ne 2 ]; then
            echo "::error::Expected one .tar.gz and one .zip in dist-built, found ${#assets[@]}"
            exit 1
          fi
          too_big=0
          for asset in "${assets[@]}"; do
            size=$(stat -c %s "$asset")
            printf '%-40s %10s MiB\n' "$asset" "$((size / 1024 / 1024))"
            if [ "$size" -ge 2147483648 ]; then
              echo "::error::$asset is larger than GitHub's 2 GiB release-asset limit"
              too_big=1
            fi
          done
          [ "$too_big" -eq 0 ]
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Linux Bundle
        uses: actions/upload-artifact@v7
        with:
          name: VBLIS-Linux-${{ env.VERSION }}
          path: |
            dist-built/*.tar.gz
            dist-built/SHA256SUMS.txt
          retention-days: 30

      - name: Upload Web Interface (.zip)
        uses: actions/upload-artifact@v7
        with:
          name: VBLIS-Web-${{ env.VERSION }}
          path: |
            dist-built/*.zip
            dist-built/SHA256SUMS.txt
          retention-days: 30

      - name: Create Draft GitHub Release
        if: needs.prepare.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          # Where a manual run's tag is created when you publish the draft: the commit built here,
          # not the default branch's head by then. Ignored when the tag already exists (tag push).
          target_commitish: ${{ github.sha }}
          name: Release ${{ env.VERSION }}
          # Review the notes and assets, then publish by hand
          draft: true
          prerelease: ${{ inputs.prerelease == true }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist-built/*.tar.gz
            dist-built/*.zip
            dist-built/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
